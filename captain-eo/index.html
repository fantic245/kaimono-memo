<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05061a">
<title>キャプテンEO</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    position: relative; overflow: hidden; color: #fff;
    font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background:
      radial-gradient(ellipse at 50% 108%, #5b1d8f 0%, rgba(91, 29, 143, 0) 58%),
      radial-gradient(ellipse at 50% -10%, #10206b 0%, rgba(16, 32, 107, 0) 55%),
      #05061a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px; padding: 16px; box-sizing: border-box;
  }
  /* 星 */
  .stars, .stars::before, .stars::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-repeat: repeat;
  }
  .stars {
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 90px 120px, #cfe0ff, transparent),
      radial-gradient(1.5px 1.5px at 160px 60px, #fff, transparent),
      radial-gradient(1px 1px at 230px 180px, #ffe9c9, transparent),
      radial-gradient(1px 1px at 60px 210px, #fff, transparent);
    background-size: 260px 240px;
    animation: twinkle 4s ease-in-out infinite;
  }
  .stars::before {
    background-image:
      radial-gradient(1px 1px at 40px 90px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 130px 20px, #bcd3ff, transparent),
      radial-gradient(1px 1px at 200px 150px, #fff, transparent);
    background-size: 310px 270px; animation: twinkle 6s ease-in-out infinite reverse;
  }
  .stars::after {
    background-image:
      radial-gradient(2px 2px at 75px 45px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 250px 100px, #ffd6e8, transparent);
    background-size: 380px 330px; animation: twinkle 5s ease-in-out infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  .title {
    position: relative; margin: 0; text-align: center;
    font-size: clamp(26px, 8vw, 40px); letter-spacing: .12em; font-weight: 800;
    background: linear-gradient(90deg, #7fd4ff, #ff7bd5, #ffd86b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 24px rgba(127, 212, 255, .25);
  }
  .title small { display: block; margin-top: 6px; font-size: .38em; letter-spacing: .5em; color: #9aa7d6; -webkit-text-fill-color: #9aa7d6; font-weight: 500; }

  .play {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: min(70vw, 340px); height: min(70vw, 340px); border-radius: 50%;
    text-decoration: none; color: #fff; text-align: center;
    background: radial-gradient(circle at 35% 30%, #ff8ad8 0%, #b02ee0 42%, #4a1aa8 100%);
    box-shadow: 0 0 0 4px rgba(255, 255, 255, .12), 0 0 40px 6px rgba(190, 80, 255, .6), 0 0 110px 20px rgba(80, 140, 255, .35), inset 0 -12px 30px rgba(0, 0, 0, .35);
    -webkit-tap-highlight-color: transparent;
  }
  .play::before, .play::after {
    content: ""; position: absolute; inset: -14px; border-radius: 50%;
    border: 2px solid rgba(160, 200, 255, .55); animation: ring 2.6s ease-out infinite;
  }
  .play::after { animation-delay: 1.3s; }
  @keyframes ring { 0% { transform: scale(.96); opacity: .8; } 100% { transform: scale(1.32); opacity: 0; } }
  .play:active { transform: scale(.97); }
  .tri {
    width: 0; height: 0; margin-left: 12px;
    border-top: 38px solid transparent; border-bottom: 38px solid transparent; border-left: 64px solid #fff;
    filter: drop-shadow(0 0 14px rgba(255, 255, 255, .85));
  }
  .label { margin-top: 18px; font-size: 22px; font-weight: 700; letter-spacing: .08em; line-height: 1.4; text-shadow: 0 2px 10px rgba(0, 0, 0, .5); }

  .sub { position: relative; color: #8c97c4; font-size: 14px; text-decoration: underline; }
</style>
</head>
<body>
  <div class="stars"></div>
  <h1 class="title">キャプテンEO<small>TAP TO PLAY</small></h1>
  <a class="play" href="https://www.youtube.com/watch?v=YwMfeKFp2H4">
    <span class="tri"></span>
    <span class="label">見る</span>
  </a>
  <a class="sub" href="https://www.youtube.com/results?search_query=%E3%82%AD%E3%83%A3%E3%83%97%E3%83%86%E3%83%B3EO">見られないときは、YouTubeで探す</a>
</body>
</html>
