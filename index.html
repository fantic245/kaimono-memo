<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>買い物メモ</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5C7A5A">
<style>
  :root{
    --paper: #F7F2E7;
    --paper-line: #E3D9C4;
    --ink: #2E3A32;
    --ink-soft: #6B7568;
    --leaf: #5C7A5A;
    --leaf-deep: #435C42;
    --tomato: #B0553F;
    --tag-food: #C98A4B;
    --tag-daily: #5C7A9A;
    --tag-etc: #9A7CA0;
    --shadow: rgba(46,58,50,0.12);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 40px;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    color:var(--ink);
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:transparent;
    padding-bottom:170px;
  }
  header{
    padding:28px 20px 14px;
    position:relative;
  }
  header h1{
    margin:0;
    font-size:26px;
    font-weight:800;
    letter-spacing:.04em;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  header h1 .mark{
    color:var(--leaf);
    font-size:22px;
  }
  header .sub{
    margin-top:6px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .progress-wrap{
    margin:14px 20px 0;
    height:6px;
    border-radius:6px;
    background:var(--paper-line);
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--leaf), var(--leaf-deep));
    transition:width .35s ease;
  }
  .progress-label{
    margin:6px 20px 0;
    font-size:12px;
    color:var(--ink-soft);
    text-align:right;
  }

  .filters{
    display:flex;
    gap:8px;
    padding:16px 20px 4px;
    overflow-x:auto;
  }
  .filter-chip{
    flex:0 0 auto;
    padding:6px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    border:1.5px solid var(--paper-line);
    background:#fff;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .filter-chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }

  ul.list{
    list-style:none;
    margin:8px 0 0;
    padding:0 16px;
  }
  .cat-heading{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    padding:16px 4px 6px;
    letter-spacing:.05em;
  }
  li.item{
    display:flex;
    align-items:center;
    gap:12px;
    background:#fff;
    border-radius:14px;
    padding:14px 14px;
    margin-bottom:8px;
    box-shadow:0 1px 3px var(--shadow);
    transform:translateX(0);
    transition: opacity .25s ease, transform .25s ease;
  }
  li.item.checked{
    opacity:.55;
  }
  li.item.removing{
    opacity:0;
    transform:translateX(40px);
  }
  .check{
    flex:0 0 auto;
    width:26px;
    height:26px;
    border-radius:8px;
    border:2px solid var(--leaf);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:#fff;
    font-size:16px;
    font-weight:900;
  }
  li.item.checked .check{
    background:var(--leaf);
  }
  .item-main{
    flex:1 1 auto;
    min-width:0;
  }
  .item-name{
    font-size:16px;
    font-weight:600;
    word-break:break-word;
  }
  li.item.checked .item-name{
    text-decoration:line-through;
    color:var(--ink-soft);
  }
  .item-meta{
    margin-top:2px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .qty{
    font-size:12px;
    color:var(--ink-soft);
  }
  .tag{
    font-size:11px;
    font-weight:700;
    padding:2px 8px;
    border-radius:999px;
    color:#fff;
  }
  .tag.food{ background:var(--tag-food); }
  .tag.daily{ background:var(--tag-daily); }
  .tag.etc{ background:var(--tag-etc); }

  .item-main{ cursor:pointer; }
  li.item.editing{
    flex-direction:column;
    align-items:stretch;
    gap:8px;
    outline:2px solid var(--leaf);
  }
  .edit-row{ display:flex; gap:8px; }
  .edit-row input[type="text"]{
    flex:1 1 auto;
    min-width:0;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid var(--paper-line);
    font-size:16px;
    color:var(--ink);
    background:#fff;
  }
  .edit-row input.edit-qty{ flex:0 0 72px; text-align:center; }
  .edit-cats{ display:flex; gap:6px; }
  .edit-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .edit-actions button{
    border:none;
    border-radius:10px;
    padding:9px 18px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .edit-save{ background:var(--leaf); color:#fff; }
  .edit-cancel{ background:var(--paper-line); color:var(--ink-soft); }

  .del{
    flex:0 0 auto;
    width:32px;
    height:32px;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:18px;
    cursor:pointer;
  }
  .del:active{ color:var(--tomato); }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty .big{
    font-size:40px;
    margin-bottom:8px;
  }

  .clear-row{
    text-align:center;
    padding:14px 20px 0;
  }
  .clear-btn{
    border:none;
    background:none;
    color:var(--tomato);
    font-size:13px;
    font-weight:600;
    padding:8px;
    cursor:pointer;
  }

  .composer{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    background:var(--paper);
    border-top:1px solid var(--paper-line);
    padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  }
  .composer-row{
    display:flex;
    gap:8px;
  }
  .composer input[type="text"]{
    flex:1 1 auto;
    min-width:0;
    padding:12px 14px;
    border-radius:12px;
    border:1.5px solid var(--paper-line);
    background:#fff;
    font-size:16px;
    color:var(--ink);
  }
  .composer input[type="text"]:focus{
    outline:2px solid var(--leaf);
    outline-offset:1px;
  }
  .qty-input{
    width:56px !important;
    flex:0 0 56px;
    text-align:center;
  }
  .add-btn{
    flex:0 0 auto;
    width:46px;
    height:46px;
    border:none;
    border-radius:12px;
    background:var(--leaf);
    color:#fff;
    font-size:22px;
    font-weight:700;
    line-height:1;
    cursor:pointer;
  }
  .add-btn:active{ background:var(--leaf-deep); }

  .cat-select{
    display:flex;
    gap:6px;
    margin-top:8px;
  }
  .cat-btn{
    flex:1 1 0;
    padding:8px 4px;
    border-radius:10px;
    border:1.5px solid var(--paper-line);
    background:#fff;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .cat-btn.active.food{ background:var(--tag-food); border-color:var(--tag-food); color:#fff; }
  .cat-btn.active.daily{ background:var(--tag-daily); border-color:var(--tag-daily); color:#fff; }
  .cat-btn.active.etc{ background:var(--tag-etc); border-color:var(--tag-etc); color:#fff; }

  .store-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
  }
  .store-row input[type="text"]{
    flex:0 0 38%;
    min-width:0;
    padding:8px 10px;
    border-radius:10px;
    border:1.5px solid var(--paper-line);
    background:#fff;
    font-size:14px;
    color:var(--ink);
  }
  .store-row input[type="text"]:focus{
    outline:2px solid var(--leaf);
    outline-offset:1px;
  }
  .store-chips{
    flex:1 1 auto;
    display:flex;
    gap:6px;
    overflow-x:auto;
    min-width:0;
  }
  .store-chip{
    flex:0 0 auto;
    padding:6px 10px;
    border-radius:999px;
    border:1.5px solid var(--paper-line);
    background:#fff;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .store-chip.active{
    background:var(--leaf);
    border-color:var(--leaf);
    color:#fff;
  }
  .filter-chip.store{ border-color:var(--leaf); color:var(--leaf-deep); }
  .filter-chip.store.active{ background:var(--leaf-deep); border-color:var(--leaf-deep); color:#fff; }
  .tag.store{
    background:#fff;
    color:var(--leaf-deep);
    border:1.5px solid var(--leaf);
    padding:1px 8px;
  }
  .edit-store{
    padding:9px 12px;
    border-radius:10px;
    border:1.5px solid var(--paper-line);
    font-size:15px;
    color:var(--ink);
    background:#fff;
    width:100%;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="mark">✓</span>買い物メモ</h1>
    <div class="sub" id="dateLabel"></div>
  </header>

  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="progress-label" id="progressLabel">0 / 0 こ</div>

  <div class="filters">
    <div class="filter-chip active" data-filter="all">すべて</div>
    <div class="filter-chip" data-filter="food">食品</div>
    <div class="filter-chip" data-filter="daily">日用品</div>
    <div class="filter-chip" data-filter="etc">その他</div>
  </div>

  <ul class="list" id="list"></ul>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="big">🛒</div>
    <div>まだメモがありません<br>下の欄から追加してください</div>
  </div>

  <div class="clear-row" id="clearRow" style="display:none;">
    <button class="clear-btn" id="clearChecked">チェック済みをまとめて削除</button>
  </div>
</div>

<div class="composer">
  <div class="composer-row">
    <input type="text" id="nameInput" placeholder="品物名を入力" maxlength="40">
    <input type="text" id="qtyInput" class="qty-input" placeholder="1個" maxlength="8">
    <button class="add-btn" id="addBtn">＋</button>
  </div>
  <div class="cat-select">
    <button class="cat-btn active food" data-cat="food">食品</button>
    <button class="cat-btn daily" data-cat="daily">日用品</button>
    <button class="cat-btn etc" data-cat="etc">その他</button>
  </div>
  <div class="store-row">
    <input type="text" id="storeInput" placeholder="お店（任意）" maxlength="20">
    <div class="store-chips" id="storeChips"></div>
  </div>
</div>
<datalist id="storeList"></datalist>

<script>
(function(){
  const STORAGE_KEY = "shopping-memo-items-v1";
  const STORES_KEY = "shopping-memo-stores-v1";
  const CAT_LABEL = { food:"食品", daily:"日用品", etc:"その他" };

  let items = load();
  let recentStores = loadStores();
  let currentCat = "food";
  let currentFilter = "all";
  let editingId = null;

  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("emptyState");
  const clearRow = document.getElementById("clearRow");
  const nameInput = document.getElementById("nameInput");
  const qtyInput = document.getElementById("qtyInput");
  const addBtn = document.getElementById("addBtn");
  const storeInput = document.getElementById("storeInput");
  const storeChips = document.getElementById("storeChips");
  const storeList = document.getElementById("storeList");
  const progressBar = document.getElementById("progressBar");
  const progressLabel = document.getElementById("progressLabel");
  const dateLabel = document.getElementById("dateLabel");

  dateLabel.textContent = new Date().toLocaleDateString("ja-JP", { month:"long", day:"numeric", weekday:"short" });

  document.querySelectorAll(".cat-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      currentCat = btn.dataset.cat;
    });
  });

  document.querySelector(".filters").addEventListener("click", e=>{
    const chip = e.target.closest(".filter-chip");
    if(!chip) return;
    currentFilter = chip.dataset.filter;
    render();
  });

  function loadStores(){
    try{
      const parsed = JSON.parse(localStorage.getItem(STORES_KEY) || "[]");
      return Array.isArray(parsed) ? parsed.filter(s=>typeof s === "string" && s) : [];
    }catch(e){
      console.error("お店の読み込みに失敗しました", e);
      return [];
    }
  }

  function rememberStore(name){
    if(!name) return;
    recentStores = [name].concat(recentStores.filter(s=>s!==name)).slice(0, 8);
    try{
      localStorage.setItem(STORES_KEY, JSON.stringify(recentStores));
    }catch(e){
      console.error("お店の保存に失敗しました", e);
    }
  }

  function renderStoreUi(){
    const inputVal = storeInput.value.trim();
    storeChips.innerHTML = "";
    recentStores.forEach(name=>{
      const b = document.createElement("button");
      b.type = "button";
      b.className = "store-chip" + (name === inputVal ? " active" : "");
      b.textContent = name;
      b.addEventListener("click", ()=>{
        storeInput.value = (storeInput.value.trim() === name) ? "" : name;
        renderStoreUi();
      });
      storeChips.appendChild(b);
    });
    storeList.innerHTML = "";
    recentStores.forEach(name=>{
      const o = document.createElement("option");
      o.value = name;
      storeList.appendChild(o);
    });
  }

  function renderFilters(){
    const filtersEl = document.querySelector(".filters");
    filtersEl.querySelectorAll(".filter-chip.store").forEach(c=>c.remove());
    const used = [];
    recentStores.forEach(s=>{ if(items.some(i=>i.store===s)) used.push(s); });
    items.forEach(i=>{ if(i.store && !used.includes(i.store)) used.push(i.store); });
    if(currentFilter.indexOf("store:") === 0 && !used.includes(currentFilter.slice(6))){
      currentFilter = "all";
    }
    used.forEach(name=>{
      const c = document.createElement("div");
      c.className = "filter-chip store";
      c.dataset.filter = "store:" + name;
      c.textContent = name;
      filtersEl.appendChild(c);
    });
    filtersEl.querySelectorAll(".filter-chip").forEach(c=>{
      c.classList.toggle("active", c.dataset.filter === currentFilter);
    });
  }

  storeInput.addEventListener("input", renderStoreUi);

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)) return parsed;
      return [];
    }catch(e){
      console.error("読み込みに失敗しました", e);
      return [];
    }
  }

  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }catch(e){
      console.error("保存に失敗しました", e);
    }
  }

  function addItem(){
    const name = nameInput.value.trim();
    if(!name) { nameInput.focus(); return; }
    const qty = qtyInput.value.trim();
    const store = storeInput.value.trim();
    items.unshift({
      id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
      name: name,
      qty: qty,
      cat: currentCat,
      store: store,
      checked: false
    });
    rememberStore(store);
    nameInput.value = "";
    qtyInput.value = "";
    save();
    render();
    nameInput.focus();
  }

  addBtn.addEventListener("click", addItem);
  nameInput.addEventListener("keydown", e=>{ if(e.key === "Enter") addItem(); });
  qtyInput.addEventListener("keydown", e=>{ if(e.key === "Enter") addItem(); });

  function toggleCheck(id){
    const it = items.find(i=>i.id===id);
    if(!it) return;
    it.checked = !it.checked;
    save();
    render();
  }

  function removeItem(id, liEl){
    if(liEl){
      liEl.classList.add("removing");
      setTimeout(()=>{
        items = items.filter(i=>i.id!==id);
        save();
        render();
      }, 200);
    } else {
      items = items.filter(i=>i.id!==id);
      save();
      render();
    }
  }

  document.getElementById("clearChecked").addEventListener("click", ()=>{
    items = items.filter(i=>!i.checked);
    save();
    render();
  });

  function buildEditor(it){
    let editCat = it.cat;
    const li = document.createElement("li");
    li.className = "item editing";
    li.dataset.id = it.id;

    const row = document.createElement("div");
    row.className = "edit-row";
    const nameEdit = document.createElement("input");
    nameEdit.type = "text";
    nameEdit.maxLength = 40;
    nameEdit.value = it.name;
    const qtyEdit = document.createElement("input");
    qtyEdit.type = "text";
    qtyEdit.className = "edit-qty";
    qtyEdit.maxLength = 8;
    qtyEdit.value = it.qty || "";
    qtyEdit.placeholder = "1個";
    row.appendChild(nameEdit);
    row.appendChild(qtyEdit);

    const storeEdit = document.createElement("input");
    storeEdit.type = "text";
    storeEdit.className = "edit-store";
    storeEdit.maxLength = 20;
    storeEdit.value = it.store || "";
    storeEdit.placeholder = "お店（任意）";
    storeEdit.setAttribute("list", "storeList");

    const cats = document.createElement("div");
    cats.className = "edit-cats";
    Object.keys(CAT_LABEL).forEach(key=>{
      const b = document.createElement("button");
      b.type = "button";
      b.className = "cat-btn " + key + (key === editCat ? " active" : "");
      b.textContent = CAT_LABEL[key];
      b.addEventListener("click", ()=>{
        editCat = key;
        cats.querySelectorAll(".cat-btn").forEach(x=>x.classList.remove("active"));
        b.classList.add("active");
      });
      cats.appendChild(b);
    });

    const actions = document.createElement("div");
    actions.className = "edit-actions";
    const cancel = document.createElement("button");
    cancel.className = "edit-cancel";
    cancel.textContent = "キャンセル";
    const saveBtn = document.createElement("button");
    saveBtn.className = "edit-save";
    saveBtn.textContent = "保存";
    actions.appendChild(cancel);
    actions.appendChild(saveBtn);

    function commit(){
      const name = nameEdit.value.trim();
      if(!name){ nameEdit.focus(); return; }
      it.name = name;
      it.qty = qtyEdit.value.trim();
      it.cat = editCat;
      it.store = storeEdit.value.trim();
      rememberStore(it.store);
      editingId = null;
      save();
      render();
    }
    function abort(){ editingId = null; render(); }

    saveBtn.addEventListener("click", commit);
    cancel.addEventListener("click", abort);
    [nameEdit, qtyEdit, storeEdit].forEach(inp=>{
      inp.addEventListener("keydown", e=>{
        if(e.key === "Enter") commit();
        if(e.key === "Escape") abort();
      });
    });

    li.appendChild(row);
    li.appendChild(storeEdit);
    li.appendChild(cats);
    li.appendChild(actions);
    setTimeout(()=>nameEdit.focus(), 0);
    return li;
  }

  function render(){
    renderFilters();
    renderStoreUi();
    const filtered = currentFilter === "all"
      ? items
      : currentFilter.indexOf("store:") === 0
        ? items.filter(i=>i.store===currentFilter.slice(6))
        : items.filter(i=>i.cat===currentFilter);

    listEl.innerHTML = "";

    if(items.length === 0){
      emptyEl.style.display = "block";
      clearRow.style.display = "none";
    } else {
      emptyEl.style.display = "none";
    }

    if(filtered.length === 0 && items.length > 0){
      const li = document.createElement("li");
      li.style.textAlign = "center";
      li.style.color = "var(--ink-soft)";
      li.style.padding = "30px 0";
      li.style.fontSize = "13px";
      li.textContent = "該当するメモはありません";
      listEl.appendChild(li);
    }

    filtered.forEach(it=>{
      if(it.id === editingId){
        listEl.appendChild(buildEditor(it));
        return;
      }
      const li = document.createElement("li");
      li.className = "item" + (it.checked ? " checked" : "");
      li.dataset.id = it.id;

      const check = document.createElement("div");
      check.className = "check";
      check.textContent = it.checked ? "✓" : "";
      check.addEventListener("click", ()=>toggleCheck(it.id));

      const main = document.createElement("div");
      main.className = "item-main";
      const nameDiv = document.createElement("div");
      nameDiv.className = "item-name";
      nameDiv.textContent = it.name;
      const metaDiv = document.createElement("div");
      metaDiv.className = "item-meta";
      const tag = document.createElement("span");
      tag.className = "tag " + it.cat;
      tag.textContent = CAT_LABEL[it.cat] || "その他";
      metaDiv.appendChild(tag);
      if(it.store){
        const storeTag = document.createElement("span");
        storeTag.className = "tag store";
        storeTag.textContent = it.store;
        metaDiv.appendChild(storeTag);
      }
      if(it.qty){
        const qtySpan = document.createElement("span");
        qtySpan.className = "qty";
        qtySpan.textContent = it.qty;
        metaDiv.appendChild(qtySpan);
      }
      main.appendChild(nameDiv);
      main.appendChild(metaDiv);
      main.addEventListener("click", ()=>{ editingId = it.id; render(); });

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "✕";
      del.addEventListener("click", ()=>removeItem(it.id, li));

      li.appendChild(check);
      li.appendChild(main);
      li.appendChild(del);
      listEl.appendChild(li);
    });

    const total = items.length;
    const done = items.filter(i=>i.checked).length;
    progressBar.style.width = total ? Math.round(done/total*100) + "%" : "0%";
    progressLabel.textContent = done + " / " + total + " こ";
    clearRow.style.display = (items.length > 0 && done > 0) ? "block" : "none";
  }

  render();

  if("serviceWorker" in navigator && location.protocol !== "file:"){
    navigator.serviceWorker.register("sw.js").catch(e=>console.error("オフライン用の登録に失敗しました", e));
  }
})();
</script>
</body>
</html>
